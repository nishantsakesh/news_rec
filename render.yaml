services:
  # Backend Python Web Service
  - type: web
    name: newsrec-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn 'app:create_app()'"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newsrec-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NEWS_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.5

  # Frontend React Static Site
  - type: web
    name: newsrec-web
    env: static
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://newsrec-api.onrender.com/api"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

  # PostgreSQL Database
  - type: pserv
    name: newsrec-db
    env: postgres
    plan: free
    postgresMajorVersion: 14

  # Cron Job to fetch news
  - type: cron
    name: news-fetcher
    env: python
    rootDir: backend
    plan: free
    schedule: "0 */6 * * *"
    command: |
      pip install -r requirements.txt
      python -c "
      from app import create_app
      from app.extensions import db
      from app.services.news_fetcher import fetch_and_store_articles
      
      app = create_app()
      with app.app_context():
          try:
              count = fetch_and_store_articles()
              print(f'Successfully fetched {count} articles')
          except Exception as e:
              print(f'Error fetching articles: {e}')
              raise
      "